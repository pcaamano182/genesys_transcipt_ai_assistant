genesys:
  region: us_west_2
  client_id: ""
  client_secret: ""
  # client_credentials: no browser needed (default)
  # authorization_code: interactive browser login
  grant_type: "client_credentials"
  redirect_uri: "http://localhost:8080/callback"  # only used with authorization_code
  page_size: 100

google:
  project_id: ""          # override with GOOGLE_CLOUD_PROJECT env var
  location: "us-central1"
  model: "gemini-1.5-pro"
  # Optional: override the default Google Cloud SDK OAuth client.
  # Leave empty — the embedded gcloud SDK client is used automatically.
  oauth_client_id: ""
  oauth_client_secret: ""

processing:
  batch_size: 20
  max_workers: 5
  max_retries: 3
  retry_delay_seconds: 2
  max_transcript_chars: 100000

output:
  default_formats:
    - csv
  output_dir: "./output"
